<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    Sachin Gold mark — the simplified replacement for the ornate gold-foil
    badge (laurel wreath / ribbon / stars), which fought the site's
    restrained pine+gold system everywhere it appeared (tab icon, share
    card). Geometry: two sheaf strokes cradling a wheat-grain SG monogram.
    Flat vector fills only — no gradients, bevels or foil.
    Colors are the Tailwind brand tokens: #B68A1E (wheat), #0F4C2E (pine),
    #0A3620 (pine-deep).
  -->
  <rect width="96" height="96" rx="14" fill="#0A3620" />
  <!-- sheaf cradle: two mirrored strokes -->
  <path d="M22 70 C22 46 34 32 48 30" fill="none" stroke="#B68A1E" stroke-width="4.5" stroke-linecap="round" />
  <path d="M74 70 C74 46 62 32 48 30" fill="none" stroke="#B68A1E" stroke-width="4.5" stroke-linecap="round" />
  <!-- grain kernels at the stem tips -->
  <ellipse cx="48" cy="24.5" rx="4.2" ry="6.2" fill="#B68A1E" />
  <!-- SG monogram -->
  <text x="48" y="63" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" letter-spacing="1.5" fill="#B68A1E" text-anchor="middle">SG</text>
  <path d="M36 71 H60" stroke="#0F4C2E" stroke-width="2.5" stroke-linecap="round" />
</svg>
