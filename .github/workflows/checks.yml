name: Release checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ci-mocked-access-key
      NEXT_PUBLIC_SITE_URL: https://sachingold.com
      RATES_REVALIDATE_SECRET: ci-test-webhook-secret
      TEST_WEBHOOK_SECRET: ci-test-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start production server
        run: |
          npm run start -- --port 3100 > server.log 2>&1 &
          node -e "(async()=>{for(let i=0;i<30;i++){try{if((await fetch('http://localhost:3100')).ok)return}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)})()"
      - run: npm run test:browser
      - run: npm run test:splash
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: server-log
          path: server.log
